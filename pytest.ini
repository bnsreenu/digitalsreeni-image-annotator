[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --tb=short
    --strict-markers
    --cov=src/digitalsreeni_image_annotator
    --cov-report=term-missing
    --cov-report=html
# NOTE: the coverage floor (issue #77) is deliberately NOT in addopts. It would
# then apply to every partial invocation, and CI runs `pytest tests/unit` as its
# own step -- which reaches ~30% on its own and would fail the build with 900
# tests passing. The floor belongs to the FULL suite, so it lives on that one
# invocation in .github/workflows/tests.yml (and in the command below).
#
#   pytest tests/ --cov-fail-under=58
markers =
    unit: Unit tests
    integration: Integration tests
    ui: UI tests
    slow: Slow running tests
