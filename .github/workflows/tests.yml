name: Tests

on:
  # Feature-branch prefixes are included so the stacked review PR chain gets
  # full-matrix CI on every push (a pull_request event only fires when the PR
  # base is master/main/develop, which stacked PRs are not). For push events
  # GitHub uses the workflow file at the pushed commit, so this triggers
  # reliably on the branch that introduces it.
  push:
    branches:
      - master
      - main
      - develop
      - 'feature/**'
      - 'refactor/**'
      - 'perf/**'
      - 'spike/**'
  pull_request:
    branches: [ master, main, develop ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install system dependencies (Ubuntu)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        # Qt6 Linux runtime: XCB plugin set + libEGL + xkbcommon +
        # libxcb-cursor0 (required by Qt 6; was optional in Qt 5).
        # Plus xvfb for headless test runs.
        sudo apt-get install -y \
          libxcb-xinerama0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
          libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xfixes0 \
          libxcb-cursor0 libxkbcommon-x11-0 libdbus-1-3 libegl1 libgl1 \
          xvfb x11-utils

    - name: Cache pip packages
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    # Lint and type check run BEFORE the tests and as separate steps, so a
    # style or type failure is immediately distinguishable from a test failure
    # (issue #78). Both are fast.
    - name: Lint (ruff)
      run: python -m ruff check .

    - name: Type check (mypy)
      run: python -m mypy

    - name: Run unit tests
      run: |
        pytest tests/unit -v --cov=src/digitalsreeni_image_annotator --cov-report=xml --cov-report=term-missing
      env:
        QT_QPA_PLATFORM: offscreen

    - name: Run integration tests
      run: |
        pytest tests/integration -v --cov=src/digitalsreeni_image_annotator --cov-append --cov-report=xml --cov-report=term-missing
      env:
        QT_QPA_PLATFORM: offscreen

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-${{ matrix.os }}-py${{ matrix.python-version }}
        fail_ci_if_error: false

    # The coverage floor (issue #77) applies to the FULL suite only. Enforcing
    # it on the partial runs above would fail the build at ~30% with every test
    # passing, which is how a coverage gate gets deleted.
    - name: Generate coverage report and enforce the floor
      run: |
        pytest tests/ --cov=src/digitalsreeni_image_annotator --cov-report=html --cov-fail-under=58
      env:
        QT_QPA_PLATFORM: offscreen

    - name: Upload coverage HTML report
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report-${{ matrix.os }}-py${{ matrix.python-version }}
        path: htmlcov/

  # The PyQt6 ceiling (`<6.12`, ADR-046) would otherwise make itself untestable: the
  # job above installs the project, so it can only ever exercise versions the cap
  # already allows, and "re-test before raising it" would have no trigger and no
  # signal -- the project would quietly freeze on 6.11 until someone's install failed
  # to resolve. This leg installs the newest PyQt6 over the top (pip warns about the
  # conflict and proceeds) and is allowed to fail: an early warning, not a gate.
  latest-pyqt:
    name: PyQt6 latest (advisory)
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install system dependencies (Ubuntu)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libxcb-xinerama0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
          libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xfixes0 \
          libxcb-cursor0 libxkbcommon-x11-0 libdbus-1-3 libegl1 libgl1 \
          xvfb x11-utils

    - name: Install, then force the newest PyQt6 over the cap
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
        # All three named explicitly. PyQt6's own metadata pins a matching
        # PyQt6-Qt6 (6.11.0 requires >=6.11.0,<6.12.0), so the resolver would
        # pair them anyway -- but a skew here would trip the health-check test
        # for a reason that has nothing to do with the version ceiling.
        pip install --upgrade PyQt6 PyQt6-Qt6 PyQt6-sip
        python -c "import PyQt6.QtCore as c; print('PyQt6', c.PYQT_VERSION_STR, 'Qt', c.QT_VERSION_STR)"

    - name: Run the suite
      run: pytest tests/ -q --no-header
      env:
        QT_QPA_PLATFORM: offscreen

    # After the suite, and separately non-fatal. `continue-on-error` on the job stops
    # the whole job at the first failing step, so a doctor false positive here would
    # skip the very thing this job exists to run.
    - name: Report the Qt environment
      continue-on-error: true
      run: sreeni-cli doctor
